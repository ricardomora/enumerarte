name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint y formato
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests del motor y del contenido
        run: pnpm test

      # Puerta de cobertura de contenido. Falla si el idioma de respaldo tiene
      # huecos, porque es el que evita pantallas vacías en producción.
      - name: Cobertura de contenido
        run: pnpm content:check

      - name: Build
        run: pnpm build
